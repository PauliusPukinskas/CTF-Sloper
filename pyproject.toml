[project]
name = "ctf-sloper"
version = "0.1.0"
description = "Local browser-based CTF solving workbench"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.17",
  "requests==2.32.3",
  "Pillow==11.0.0",
  "numpy==2.1.3",
  "pyjwt==2.10.1",
  "base58==2.1.1",
  "pyzipper==0.3.6",
  "rarfile==4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
