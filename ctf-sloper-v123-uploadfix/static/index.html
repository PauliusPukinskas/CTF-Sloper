<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTF Sloper</title>
<style>
:root{--bg:#04150d;--panel:#071d12;--panel2:#0b2618;--line:#1b6b43;--text:#eafff2;--muted:#9fd8b7;--accent:#35d07f;--bad:#ff7979;--warn:#ffd166;--ok:#6ef0a7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#07351d,#04150d 45%,#020906);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}aside{position:fixed;inset:0 auto 0 0;width:250px;padding:18px;background:#031009;border-right:1px solid var(--line);overflow:auto}main{margin-left:250px;padding:20px;max-width:1500px}.brand{font-weight:900;font-size:24px;letter-spacing:.3px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}.nav button,.btn{border:1px solid var(--line);background:#082416;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.nav button{display:block;width:100%;margin:8px 0;text-align:left}.nav button.on,.btn.primary{background:var(--accent);border-color:var(--accent);color:#04200f;font-weight:800}.btn.danger{border-color:#a94343;background:#331111;color:#ffbaba}.card{background:linear-gradient(180deg,var(--panel),#06170e);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 16px;box-shadow:0 12px 30px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{background:#06170e;border:1px solid #154b31;border-radius:14px;padding:12px}.metric b{font-size:22px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}input,select,textarea{width:100%;background:#031009;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}textarea{min-height:95px;resize:vertical}.drop{border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;background:#03120a}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.tabs button.on{background:var(--accent);color:#04200f;font-weight:800}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #165438;background:#061a10;border-radius:999px;padding:5px 9px;color:var(--muted)}.flag{background:#052716;border:1px solid var(--accent);border-radius:12px;padding:10px;margin:8px 0;word-break:break-all}.find{background:#06170e;border:1px solid #154b31;border-radius:12px;padding:12px;margin:9px 0}.score{font-weight:900;color:var(--accent)}.hidden{display:none}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}pre{white-space:pre-wrap;overflow:auto;background:#020906;border:1px solid #123d29;border-radius:12px;padding:12px;max-height:520px}.list button{width:100%;text-align:left;margin:6px 0}.artifact{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center}.progress{height:12px;border-radius:999px;background:#031009;border:1px solid #154b31;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}.preview{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:10px}.small{font-size:12px}.fileInput{display:none}@media(max-width:850px){aside{position:static;width:auto}main{margin:0}.artifact{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <div class="brand">CTF Sloper</div>
  <div class="sub">open-source local CTF solver</div>
  <div class="nav">
    <button id="nav-create" class="on" onclick="showPage('create')">Create project</button>
    <button id="nav-projects" onclick="showPage('projects')">Projects</button>
    <button id="nav-profile" onclick="showPage('profile')">Profile / attack controls</button>
    <button id="nav-tools" onclick="showPage('tools')">Tool status</button>
  </div>
  <div id="sideStats" class="sub"></div>
</aside>
<main>
  <section id="page-create" class="page"></section>
  <section id="page-projects" class="page hidden"></section>
  <section id="page-profile" class="page hidden"></section>
  <section id="page-tools" class="page hidden"></section>
</main>
<script src="/static/index.check.js"></script>
</body>
</html>
